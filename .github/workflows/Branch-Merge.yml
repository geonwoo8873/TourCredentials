name: GitHub Credentils Branch Merge

on:
    push:
        branches:
            - gh

jobs:
    merge:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                # `ref`는 해당 트리거된 커밋의 HEAD 상태로 체크아웃 하여 `push` 이벤트에서 내부적으로 SHA 해시를 기준으로 체크아웃 한다.
                ref: gh

            - name: Configure Git
              run: |
                git config user.name "GitHub Actions"
                git config user.email "geonwoo8873@outlook.com"

            - name: Merge Branch
              # `--no-ff<ff: fast-forward>` 옵션은 병합 커밋을 생성하여 병합 이력을 명확하게 유지하는 데 사용된다.
              # 이 옵션을 사용하면 병합이 단일 커밋으로 기록되며, 병합된 브랜치의 변경 사항이 명확하게 구분된다.
              run: |
                git featch origin main
                git checkout -B main
                git merge gh --no-ff -m "Merge branch 'gh' into main"
                git push origin main
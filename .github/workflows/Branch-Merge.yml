name: GitHub Credentials Branch Merge

on:
  push:
    branches:
      - gh

permissions:
  contents: write       # `contents`는 Repository contents에 대한 권한을 설정 (read, write, admin)
  # pull-requests: write  # `pull-requests`는 Pull Request에 대한 권한을 설정 (read, write, admin)

# concurrency:
#   group: branch-merge-gh-to-main
#   cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh
        uses: actions/checkout@v4
        with:
          ref: gh        # `ref: <branch-name>`은 특정 브랜치를 체크아웃하는 옵션이다. (기본값: 현재 브랜치)
          fetch-depth: 0 # `fetch-depth: <n>`는 git hitory에서 최신 로그 기준으로 n개 만큼 범위를 지정하여 가져온다.(0: ALL)


      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Automation"
          git config user.email "geonwoo8873@outlook.com"

      - name: Merge gh into main
        run: |
          git fetch origin main gh
          git checkout main
          git merge --no-ff --no-edit origin/gh
          git push origin main

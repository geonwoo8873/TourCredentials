name: GitHub Credentials Branch Merge

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to merge into main (credential or docker)
        required: false
        type: string
  push:
    branches:
      - credential
      - docker
      - net

concurrency:
  group: branch-merge-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `fetch-depth: <n>` is not supported when using `git fetch` with multiple branches

      - name: Resolve source branch
        id: source
        shell: bash
        run: |
          SOURCE_BRANCH="${{ github.event.inputs.source_branch }}"
          if [ -z "$SOURCE_BRANCH" ]; then
            SOURCE_BRANCH="${GITHUB_REF_NAME}"
          fi

          case "$SOURCE_BRANCH" in
            credential|docker)
              echo "branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported source branch: $SOURCE_BRANCH"
              exit 1
              ;;
          esac

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Automation"
          git config user.email "geonwoo8873@outlook.com"

      - name: Merge source branch into main
        shell: bash
        run: |
          SOURCE_BRANCH="${{ steps.source.outputs.branch }}"

          git fetch origin main "$SOURCE_BRANCH"
          git checkout -B main origin/main

          git merge --no-ff --no-edit "origin/$SOURCE_BRANCH"
          git push origin HEAD:main

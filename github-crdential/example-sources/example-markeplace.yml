name: Node.js CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm install && npm test

trigger:
  - main
pool:
  vmImage: 'ubuntu-latest'
steps:
  - script: echo "Deploying via Azure Pipelines"